name: NAVIGO APK size audit

on:
  push:
    branches:
      - feature/customer-map-responsive-flow
    paths:
      - ".github/workflows/navigo-apk-size-audit.yml"

permissions:
  contents: read

jobs:
  measure-existing-apk:
    name: Download and measure the completed preview APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 27.11.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install workspace dependencies for Expo config plugins
        run: npm install

      - name: Retrieve previous NAVIGO Android build history
        working-directory: apps/mobile
        run: |
          eas build:list --platform android --limit 15 --json > "$RUNNER_TEMP/navigo-build-history.json"
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(JSON.stringify(d,null,2));' "$RUNNER_TEMP/navigo-build-history.json"

      - name: Retrieve completed EAS build metadata
        working-directory: apps/mobile
        run: |
          eas build:view c51830a8-1cf3-4756-8a76-16b181c3cc40 --json > "$RUNNER_TEMP/navigo-build.json"

      - name: Download APK and report exact size
        env:
          BUILD_JSON: ${{ runner.temp }}/navigo-build.json
          APK_PATH: ${{ runner.temp }}/navigo-preview.apk
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.env.BUILD_JSON, "utf8"));
          const candidates = [];

          function visit(value, key = "") {
            if (typeof value === "string") {
              if (/^https:\/\//i.test(value) && (/\.apk(?:[?#].*)?$/i.test(value) || /buildurl|applicationarchiveurl/i.test(key))) {
                candidates.push({ key, value });
              }
              return;
            }
            if (Array.isArray(value)) {
              value.forEach((item, index) => visit(item, String(index)));
              return;
            }
            if (value && typeof value === "object") {
              for (const [childKey, childValue] of Object.entries(value)) {
                visit(childValue, childKey);
              }
            }
          }

          visit(data);
          const selected =
            candidates.find(item => /buildurl/i.test(item.key)) ||
            candidates.find(item => /\.apk(?:[?#].*)?$/i.test(item.value)) ||
            candidates[0];

          if (!selected) {
            console.error("No APK download URL was found in the EAS build metadata.");
            console.error(JSON.stringify(data, null, 2));
            process.exit(1);
          }

          fs.writeFileSync(process.env.RUNNER_TEMP + "/navigo-apk-url.txt", selected.value);
          console.log("Found the completed APK artifact URL.");
          NODE

          curl --fail --location --silent --show-error             "$(cat "$RUNNER_TEMP/navigo-apk-url.txt")"             --output "$APK_PATH"

          SIZE_BYTES="$(stat -c '%s' "$APK_PATH")"
          SIZE_MB="$(awk -v bytes="$SIZE_BYTES" 'BEGIN { printf "%.2f", bytes / 1000000 }')"
          echo "NAVIGO APK size: ${SIZE_BYTES} bytes (${SIZE_MB} MB decimal)"
          sha256sum "$APK_PATH"

      - name: Inspect package identity and APK signing certificate
        env:
          APK_PATH: ${{ runner.temp }}/navigo-preview.apk
          REPORT_PATH: ${{ runner.temp }}/navigo-apk-inspection.txt
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"

          {
            echo "=== APK size ==="
            stat -c '%n: %s bytes' "$APK_PATH"
            echo
            echo "=== Package identity / SDK ==="
            "$AAPT" dump badging "$APK_PATH" | head -n 3
            echo
            echo "=== Signature verification and signer certificate ==="
            "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
            echo
            echo "=== Largest APK contents (uncompressed) ==="
            unzip -l "$APK_PATH" | sort -nr | sed -n '1,25p'
          } | tee "$REPORT_PATH"

      - name: Upload APK inspection report
        uses: actions/upload-artifact@v4
        with:
          name: navigo-apk-package-and-signature-report
          path: ${{ runner.temp }}/navigo-apk-inspection.txt
          if-no-files-found: error
          retention-days: 7

      - name: Make the measured APK available for testing
        uses: actions/upload-artifact@v4
        with:
          name: navigo-preview-apk-dns-fallback
          path: ${{ runner.temp }}/navigo-preview.apk
          if-no-files-found: error
          retention-days: 7

      - name: Download the earlier November 20 baseline APK
        env:
          BASELINE_APK: ${{ runner.temp }}/navigo-baseline.apk
        run: |
          curl --fail --location --silent --show-error \
            "https://expo.dev/artifacts/eas/-DDdFYiQn0XsYiX9ZyCSlpCeuxp4JuiA9BmcH-583AU.apk" \
            --output "$BASELINE_APK"
          echo "Baseline APK size:"
          stat -c '%s bytes' "$BASELINE_APK"
          sha256sum "$BASELINE_APK"

      - name: Compare baseline and DNS-fallback APK installation on a clean Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BASELINE_APK: ${{ runner.temp }}/navigo-baseline.apk
          CURRENT_APK: ${{ runner.temp }}/navigo-preview.apk
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            echo "=== Emulator platform ==="
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.product.cpu.abi

            echo "=== Install earlier baseline APK (November 20) ==="
            adb install "$BASELINE_APK"
            baseline_status=$?
            echo "BASELINE_INSTALL_EXIT_CODE=$baseline_status"

            if [ "$baseline_status" -eq 0 ]; then
              adb shell pm path ug.ac.muni.navigo
              adb uninstall ug.ac.muni.navigo
            fi

            echo "=== Install current DNS-fallback APK (November 23) ==="
            adb install "$CURRENT_APK"
            current_status=$?
            echo "CURRENT_INSTALL_EXIT_CODE=$current_status"

            if [ "$current_status" -eq 0 ]; then
              adb shell pm path ug.ac.muni.navigo
            fi

            if [ "$baseline_status" -eq 0 ] && [ "$current_status" -ne 0 ]; then
              echo "RESULT: baseline installs, current APK fails on Android API 35."
              exit 1
            fi

            if [ "$baseline_status" -ne 0 ] && [ "$current_status" -ne 0 ]; then
              echo "RESULT: both APKs fail; inspect emulator and artifact details."
              exit 1
            fi

            if [ "$current_status" -eq 0 ]; then
              echo "RESULT: current APK installs successfully on Android API 35."
            fi
