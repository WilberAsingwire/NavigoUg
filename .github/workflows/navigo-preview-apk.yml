name: NAVIGO preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview-apk:
    name: Build installable Android preview
    runs-on: ubuntu-latest
    steps:
      - name: Check for Expo access token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add the EXPO_TOKEN repository secret before starting an EAS build."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install workspace dependencies
        run: npm install

      - name: Build Android preview APK
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --non-interactive --wait
